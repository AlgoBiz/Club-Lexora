version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SETTINGS_MODULE=core.settings.dev
    networks:
      - travel-network

volumes:
  static_volume:
  media_volume:

networks:
  travel-network:
    driver: bridge
